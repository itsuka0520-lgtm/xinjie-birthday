<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1430">
<title>鑫姐，生日快乐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
<style>
  /* 单一夜色主题：深紫画纸 + 米色粉笔线，刻意不随系统切换 */
  :root{
    --night:#1a1430; --paper:#231b3f; --ink:#f3e7cf; --ink-dim:#a89b93;
    --gold:#f2c46b; --rose:#e8536f; --violet:#9b86e6; --rule:#f3e7cf33;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{background:var(--night);color:var(--ink);margin:0}
  body{font-family:"ZCOOL XiaoWei","KaiTi","STKaiti","Songti SC",serif;padding-inline:16px;padding-block:28px 56px;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:6px 24px}
  h1{font-family:"Ma Shan Zheng","KaiTi","STKaiti",serif;font-weight:400;font-size:clamp(38px,6.4vw,60px);line-height:1;margin:0;letter-spacing:.08em;color:var(--gold);text-wrap:balance}
  .sub{color:var(--ink-dim);font-size:15px;letter-spacing:.14em;margin:0}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:var(--paper);border-radius:7px 12px 6px 14px/12px 6px 14px 7px;overflow:hidden;box-shadow:0 0 0 2px var(--rule),0 34px 80px -34px #000}
  canvas{display:block;width:100%;height:100%;cursor:pointer}
  canvas:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
  .wait{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(26,20,48,0) 30%,rgba(26,20,48,.55) 100%);animation:fadeIn .5s both}
  .wait[hidden]{display:none}
  .wait .box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 18px}
  .wait p{margin:0;font-family:"Ma Shan Zheng","KaiTi",serif;font-size:clamp(20px,4.2vw,34px);color:var(--gold);letter-spacing:.08em;text-shadow:0 2px 18px rgba(0,0,0,.7);animation:breathe 2.2s ease-in-out infinite}
  .wait button{pointer-events:auto;font:inherit;font-size:14px;letter-spacing:.1em;color:var(--ink);background:#1a143099;border:1.5px dashed var(--rule);border-radius:10px 4px 12px 5px;padding:8px 14px;cursor:pointer}
  .wait button:hover{border-color:var(--gold)}
  .wait small{font-size:12px;color:var(--ink-dim);letter-spacing:.08em;min-height:1.2em}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .bar{display:flex;align-items:center;gap:14px}
  .play,.mute{flex:none;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center}
  .play{background:var(--gold);color:var(--night);box-shadow:0 0 0 4px #f2c46b22}
  .mute{background:transparent;color:var(--ink-dim);border:1.5px dashed var(--rule);font-size:18px}
  .play:focus-visible,.chap:focus-visible,.mute:focus-visible,.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .play svg{width:20px;height:20px;fill:currentColor}
  input[type=range]{flex:1;min-width:0;accent-color:var(--gold);height:28px;cursor:pointer}
  .time{font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink-dim);letter-spacing:.04em;min-width:88px;text-align:right}
  .chapters{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
  .chap{font:inherit;flex:1 1 150px;text-align:left;cursor:pointer;color:var(--ink);background:transparent;border:1.5px dashed var(--rule);border-radius:10px 4px 12px 5px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s}
  .chap b{font-family:"Ma Shan Zheng","KaiTi",serif;font-weight:400;font-size:22px;color:var(--gold);letter-spacing:.06em}
  .chap span{font-size:13px;color:var(--ink-dim);letter-spacing:.1em}
  .chap:hover{border-color:#f2c46b88}
  .chap[aria-current="true"]{border-style:solid;border-color:var(--gold);background:#f2c46b12}
  .hint{font-size:13px;color:var(--ink-dim);letter-spacing:.1em;margin:0}

  /* 短片下面：祝福卡 + 原画 + 署名 */
  .cards{margin-top:30px}
  h2{font-family:"Ma Shan Zheng","KaiTi",serif;font-weight:400;font-size:clamp(26px,4.6vw,36px);color:var(--gold);letter-spacing:.08em;margin:0 0 4px}
  .lead{color:var(--ink-dim);font-size:14px;letter-spacing:.1em;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{position:relative;height:150px;border:0;padding:0;background:none;cursor:pointer;perspective:900px;font:inherit;color:var(--ink)}
  .card .in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;border:1.5px dashed var(--rule);border-radius:10px 4px 12px 5px;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .card .front{font-family:"Ma Shan Zheng","KaiTi",serif;font-size:40px;color:var(--gold)}
  .card:nth-child(3n+2) .front{color:var(--rose)}
  .card:nth-child(3n) .front{color:var(--violet)}
  .card .back{transform:rotateY(180deg);font-size:15px;line-height:1.7;letter-spacing:.04em;border-style:solid;border-color:#f2c46b66}
  .card:hover .f{border-color:#f2c46b88}
  .orig{margin-top:34px;display:flex;flex-wrap:wrap;gap:24px 36px;align-items:center;justify-content:center}
  .orig figure{margin:0;padding:10px;border:1.5px dashed var(--rule);border-radius:7px 12px 6px 14px/12px 6px 14px 7px;background:var(--paper);max-width:300px;width:100%}
  .orig .pic{position:relative}
  .orig img{display:block;width:100%;height:auto;border-radius:6px;filter:saturate(.95)}
  .orig .hat{position:absolute;width:22%;left:27%;top:-4%;transform:rotate(-14deg);filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));animation:hatBob 2.6s ease-in-out infinite}
  @keyframes hatBob{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-11deg) translateY(-3px)}}
  .orig figcaption{font-size:13px;color:var(--ink-dim);letter-spacing:.14em;text-align:center;margin-top:8px}
  .sig{font-family:"Ma Shan Zheng","KaiTi",serif;font-size:clamp(22px,3.6vw,30px);color:var(--ink);letter-spacing:.1em;margin:0;text-align:center}
  .sig small{display:block;font-family:"ZCOOL XiaoWei","KaiTi",serif;font-size:13px;color:var(--ink-dim);letter-spacing:.14em;margin-top:6px}
  @media (prefers-reduced-motion:reduce){.wait p{animation:none}.card .in{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>鑫姐，生日快乐</h1>
    <p class="sub">生日 · 考研上岸 · 手绘动画短片 · 26 秒</p>

    <button class="mute" id="muteBtn" aria-label="关闭音效" title="音效">🔔</button>

<script>
/* ============ 基础工具 ============ */
const W = 1280, H = 720, DUR = 26, WAIT_T = 12.5;
const cv = document.getElementById('film'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const R = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
let BOIL = 0;                                   // 线条“抖动帧”，约 8 fps，模拟逐帧手绘
const J = (seed, a) => (R(seed + BOIL * 17.13) - .5) * 2 * a;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const bump = (t, a, b) => (t > a && t < b) ? Math.sin(Math.PI * (t - a) / (b - a)) : 0;
const TAU = Math.PI * 2;
const INK = '#f3e7cf', GOLD = '#f2c46b', ROSE = '#e8536f', VIOLET = '#9b86e6', SKIN = '#f8e9d6', HAIR = '#f0c35f', HOOD = '#d39a52';
const FONT = '"Ma Shan Zheng","KaiTi","STKaiti","Microsoft YaHei",serif';

/* 镜头关键帧：[时间, 中心x, 中心y, 缩放] */
const CAM = [[0,640,400,1.25],[5,640,400,1.25],[6.5,720,420,1.3],[9.6,720,420,1.3],[10.6,620,350,2.0],
             [14.2,620,350,2.0],[16.5,640,400,1],[21,640,400,1],[22,640,370,1],[26,640,370,1]];
function cam(t){
  for (let i = 0; i < CAM.length - 1; i++){
    const a = CAM[i], b = CAM[i+1];
    if (t <= b[0]){ const k = ease(seg(t, a[0], b[0])); return {x:lerp(a[1],b[1],k), y:lerp(a[2],b[2],k), s:lerp(a[3],b[3],k)}; }
  }
  const l = CAM[CAM.length-1]; return {x:l[1], y:l[2], s:l[3]};

/* 手绘线：两遍略错开的抖动折线，p 控制“画到哪儿” */
function sketch(g, pts, {w=2, c=INK, p=1, passes=2, amp=1.2, seed=0, alpha=1}={}){
  const n = Math.floor(pts.length * clamp(p));
  if (n < 2) return;
  const base = g.globalAlpha;
  g.save(); g.strokeStyle = c; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let k = 0; k < passes; k++){
    g.globalAlpha = base * alpha * (k ? .5 : .95); g.lineWidth = w * (k ? .6 : 1);
    g.beginPath();
    for (let i = 0; i < n; i++){
      const X = pts[i][0] + J(seed + i*3.1 + k*91, amp), Y = pts[i][1] + J(seed + i*5.7 + k*53, amp);
      i ? g.lineTo(X, Y) : g.moveTo(X, Y);
    }
    g.stroke();
  }
  g.restore();
}
function circPts(cx, cy, r, seed=0, {a0=-Math.PI/2, sweep=TAU+.35, n=48, wob=.035, rx=1, ry=1}={}){
  const pts = [];
  for (let i = 0; i <= n; i++){
    const a = a0 + sweep * i / n;
    const rr = r * (1 + (R(seed + i*.37) - .5) * wob + .015*Math.sin(a*3 + seed));
    pts.push([cx + Math.cos(a)*rr*rx, cy + Math.sin(a)*rr*ry]);
  }
  return pts;
}
function linePts(x1, y1, x2, y2, n=8){ const p=[]; for(let i=0;i<=n;i++) p.push([lerp(x1,x2,i/n), lerp(y1,y2,i/n)]); return p; }
function quadPts(p0, c, p1, n=10){ const o=[]; for(let i=0;i<=n;i++){ const k=i/n, u=1-k; o.push([u*u*p0[0]+2*u*k*c[0]+k*k*p1[0], u*u*p0[1]+2*u*k*c[1]+k*k*p1[1]]); } return o; }
function ellPts(cx, cy, rx, ry, rot=0, seed=0){
  return circPts(0, 0, 1, seed, {rx, ry, n:28}).map(([x, y]) => [cx + x*Math.cos(rot) - y*Math.sin(rot), cy + x*Math.sin(rot) + y*Math.cos(rot)]);
}
/* 水彩晕染：几层半透明的不规则色块 */
function wash(g, cx, cy, r, color, alpha=.3, seed=0, layers=3, rx=1, ry=1){
  const base = g.globalAlpha;
  g.save(); g.fillStyle = color;
  for (let l = 0; l < layers; l++){
    g.globalAlpha = base * alpha; g.beginPath();
    const n = 22;
    for (let i = 0; i <= n; i++){
      const a = i / n * TAU, rr = r * (.86 + R(seed + l*13 + i) * .24);
      const x = cx + Math.cos(a)*rr*rx, y = cy + Math.sin(a)*rr*ry;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.fill();
  }
  g.restore();
}
/* 实心不规则椭圆（随抖动帧轻微变形） */
function blob(g, cx, cy, rx, ry, color, seed=0, rot=0){
  g.save(); g.fillStyle = color; g.beginPath();
  for (let i = 0; i <= 20; i++){
    const a = i / 20 * TAU, k = 1 + J(seed + i, .04);
    const x = Math.cos(a)*rx*k, y = Math.sin(a)*ry*k;
    const X = cx + x*Math.cos(rot) - y*Math.sin(rot), Y = cy + x*Math.sin(rot) + y*Math.cos(rot);
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.fill(); g.restore();
}
function poly(g, pts, color){ g.fillStyle = color; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill(); }
function star5(g, x, y, r, color, rot=0){
  g.save(); g.fillStyle = color; g.beginPath();
  for (let i = 0; i < 10; i++){ const rr = i % 2 ? r*.45 : r, a = rot - Math.PI/2 + i*Math.PI/5; const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath(); g.fill(); g.restore();
}

function girlPose(t){
  const blinkOn = ((t + 1.3) % 4.3) < .15;
  let eyes = blinkOn ? 0 : 1;
  const be = blownAt === null ? Infinity : blownAt + .9;
  const wishing = t >= T.eyesClose && t < be;
  if (wishing) eyes = 0;
  const surprise = bump(t, T.wake + .4, T.wake + 1.6);
  const smile = t > T.wake + 1.6 && !wishing;
  const blowing = blownAt === null ? 0 : bump(t, blownAt - .05, blownAt + 1.0);
  const rowing = t > T.sail[0] - .3 && t < T.land + .1;
  const wave = t > T.end + .6 ? ease(seg(t, T.end + .6, T.end + 1.4)) : 0;
  let tilt = Math.sin(t*1.1)*.025 + surprise*.08;
  if (wishing) tilt = -.06;
  if (rowing) tilt = Math.sin(t*3)*.05;
  let lh = [-32, 130], rh = [32, 130], pen = false, oar = false;
  if (t < T.wake + .2){ pen = true; rh = [28 + Math.sin(t*9)*4, 128 + Math.cos(t*9)*1.5]; lh = [-36, 132]; }
  else if (surprise > 0){ lh = [-40 - surprise*8, 60 + (1-surprise)*70]; rh = [40 + surprise*8, 60 + (1-surprise)*70]; }
  else if (wishing){ lh = [-10, 70]; rh = [10, 70]; }
  else if (rowing){ oar = true; const k = Math.sin(t*3); lh = [-28, 96]; rh = [36 + k*10, 88 + k*8]; }
  else if (wave > 0){ rh = [48, 20 - Math.sin(t*8)*10*wave]; lh = [-32, 130]; }
  return {eyes, surprise, smile, blowing, rowing, wave, tilt, lh, rh, pen, oar};
}

/* ============ 每一帧 ============ */
function render(t){
  BOIL = REDUCED ? 0 : Math.floor(performance.now() / 125);
  const c = cam(t);
  screen(ctx);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#15112a'); sky.addColorStop(1, '#2a2150');
  ctx.globalAlpha = 1; ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  applyCam(c, ctx);

  const seaA = ease(seg(t, T.seaRise[0], T.seaRise[1]));
  room(t);
  bigMoon(ctx, t);
  sea(ctx, t, false);
  shore(ctx, t);

  // 书桌 / 小船 这一组整体漂移
  const bx = lerp(0, 430, ease(seg(t, T.sail[0], T.sail[1])));
  const by = Math.sin(t*2.1)*7*seaA - bump(t, T.land - .1, T.land + .6)*8;
  const rot = Math.sin(t*1.6)*.025*seaA;
  ctx.save();
  ctx.translate(640 + bx, 480 + by); ctx.rotate(rot); ctx.translate(-640, -480);

  const deskA = 1 - ease(seg(t, T.seaRise[0] + .3, T.seaRise[1])), boatA = 1 - deskA;
  boat(ctx, boatA);
  girl(ctx, GIRL.x, GIRL.y, 1, girlPose(t), t);
  desk(ctx, deskA);
  books(ctx, deskA);
  lamp(ctx, t, deskA);

  const cakeIn = ease(seg(t, T.cakeIn[0], T.cakeIn[1]));
  const cakeX = lerp(1180, CAKE_END, cakeIn);
  cake(ctx, cakeX, DESK.y - 2, t, t > T.cakeIn[0] - .3 ? 1 : 0);

  let catX = 790, catY = DESK.y - 14, catP = {sleep:true, hat:false, headDy:0, wide:0};
  if (t > T.wake){
    const wake = ease(seg(t, T.wake, T.wake + .6));
    catP = {sleep:false, hat:t > T.wake + .6, headDy:-wake*4, wide:bump(t, T.wake, T.wake + 1)*1.5};
    catX = t < T.cakeIn[1] + .4 ? cakeX + 78 + (1-cakeIn)*20 : CAKE_END + 80;
    catY = DESK.y - 14 - wake*2 + (t > T.cakeIn[0] && t < T.cakeIn[1] ? Math.abs(Math.sin(t*10))*3 : 0);
  }
  const jumpK = ease(seg(t, T.land + .1, T.land + .9));
  if (jumpK <= 0) cat(ctx, catX, catY, .95, catP, t);
  burstStars(ctx, CAKE_END, DESK.y - 92, t);
  wishNote(ctx, CAKE_END, DESK.y - 60, t);
  ctx.restore();

  if (jumpK > 0){                                           // 猫跳上岸（世界坐标）
    const sx = lerp(640 + 430 + 175, 1215, jumpK), sy = lerp(454, 468, jumpK) - Math.sin(jumpK*Math.PI)*60;
    cat(ctx, sx, sy, .95, {sleep:false, hat:true, headDy:0, wide:0}, t);
  }

  sea(ctx, t, true);

  screen(ctx);
  endCard(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.drawImage(grain, 0, 0, cv.width, cv.height);
  screen(ctx);
  const vg = ctx.createRadialGradient(W/2, H/2, H*.45, W/2, H/2, H*1.05);
  vg.addColorStop(0, 'rgba(8,6,20,0)'); vg.addColorStop(1, 'rgba(8,6,20,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ============ 音效（极简） ============ */
let actx = null, muted = false;
const muteBtn = document.getElementById('muteBtn');
function AC(){ if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); } if (actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, dur, type='triangle', vol=.08, when=0){
  if (muted) return; const a = AC(); if (!a) return;
  const t0 = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
}
function sfxWhoosh(){ if (muted) return; const a = AC(); if (!a) return; const t0 = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(700, t0); o.frequency.exponentialRampToValueAtTime(150, t0 + .35); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.07, t0 + .03); g.gain.exponentialRampToValueAtTime(.0001, t0 + .4); o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + .45); }
function sfxChime(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, .7, 'triangle', .09, i*.11)); }
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔕' : '🔔'; muteBtn.setAttribute('aria-label', muted ? '打开音效' : '关闭音效'); });

/* ============ 播放控制 ============ */
const replayEl = document.getElementById('replay'), replayBtn = document.getElementById('replayBtn');
function restart(){ t = 0; lastT = 0; replayEl.hidden = true; playing = true; setIcon(); }
replayBtn.addEventListener('click', e => { e.stopPropagation(); restart(); });
const btn = document.getElementById('playBtn'), icon = document.getElementById('playIcon');
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
const chaps = [...document.querySelectorAll('.chap')];
function setIcon(){
  icon.innerHTML = playing
    ? '<rect x="4" y="3" width="4.5" height="14" rx="1.5"/><rect x="11.5" y="3" width="4.5" height="14" rx="1.5"/>'
    : '<path d="M5 3.2v13.6c0 .8.9 1.3 1.6.9l11-6.8c.6-.4.6-1.4 0-1.8l-11-6.8C5.9 1.9 5 2.4 5 3.2z"/>';
  btn.setAttribute('aria-label', playing ? '暂停' : '播放');
}
function toggle(){
  if (!playing && t >= DUR){ restart(); return; }
  playing = !playing; setIcon();
}
function seekTo(v){
  t = clamp(v, 0, DUR); lastT = t;
  if (t < DUR) replayEl.hidden = true;
}
btn.addEventListener('click', toggle);
cv.addEventListener('click', toggle);
scrub.addEventListener('pointerdown', () => dragging = true);
addEventListener('pointerup', () => dragging = false);
scrub.addEventListener('input', () => seekTo(+scrub.value));
chaps.forEach(b => b.addEventListener('click', () => { seekTo(+b.dataset.t); playing = true; setIcon(); }));
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT') return;
  if (e.code === 'Space' && tag !== 'BUTTON'){ e.preventDefault(); toggle(); }
  if (e.code === 'ArrowLeft') seekTo(t - 5);
  if (e.code === 'ArrowRight') seekTo(t + 5);
});
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function ui(){
  if (!dragging) scrub.value = t.toFixed(2);
  timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  let ci = 0; chaps.forEach((b, i) => { if (t >= +b.dataset.t - .01) ci = i; });
  if (ci !== lastChap){ chaps.forEach((b, i) => b.setAttribute('aria-current', i === ci)); lastChap = ci; }
}
function resize(){
  const r = cv.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
  scale = cv.width / W;
}
new ResizeObserver(resize).observe(cv); resize();
function frame(ts){
  if (last !== null && playing){
    t += Math.min(.1, (ts - last)/1000);
    if (t >= DUR){ t = DUR; playing = false; setIcon(); replayEl.hidden = false; }
    if (lastT < blownAt && t >= blownAt) sfxWhoosh();
    if (lastT < T.land && t >= T.land) sfxChime();
    if (lastT < T.end + .8 && t >= T.end + .8) sfxChime();
  }
  lastT = t; last = ts; render(t); ui(); requestAnimationFrame(frame);
}

/* 开发用：?t=秒 定位并暂停 */
const Q = new URLSearchParams(location.search);
if (Q.has('t')){ t = clamp(+Q.get('t') || 0, 0, DUR); playing = false; lastT = t; }
if (REDUCED){ t = 23.5; playing = false; lastT = t; }
setIcon();

const ALL = '生日快乐，鑫姐愿你所求皆如愿一战成硕上岸硕政治英语专业课·';
Promise.race([document.fonts.load(`40px "Ma Shan Zheng"`, ALL).catch(() => {}), new Promise(r => setTimeout(r, 1500))])
  .finally(() => requestAnimationFrame(frame));
</script>
